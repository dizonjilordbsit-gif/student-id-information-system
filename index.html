
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-PILIMUN Student ID INFORMATION</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(rgba(0, 25, 12, 0.82), rgba(0, 20, 10, 0.90)),
                url("https://ts4.mm.bing.net/th?id=OIP.BIgd-vlLpw2hbK2ITm1-XQHaEK&pid=15.1");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 35px 30px;
            text-align: center;
            background: rgba(0, 35, 18, 0.94);
            border: 2px solid #d4af37;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0, 255, 100, 0.25);
        }

        .logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px #00ff66);
        }

        h1 {
            color: #ffffff;
            font-size: 23px;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .login-title {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            outline: none;
            background: #f5f5f5;
            color: #003b20;
            font-size: 15px;
        }

        .input-group input:focus {
            border: 2px solid #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #d4af37;
            color: #003b20;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #f1d46a;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 23px 0 15px;
            color: #d4af37;
            font-size: 12px;
            font-weight: bold;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(212, 175, 55, 0.6);
        }

        .google-button {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 13px;
            background: #ffffff;
            color: #333333;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .google-button:hover {
            background: #eeeeee;
            transform: translateY(-2px);
        }

        .google-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .register-link {
            color: #ffffff;
            font-size: 13px;
            margin-top: 17px;
        }

        .register-link a {
            color: #d4af37;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .message {
            min-height: 20px;
            color: #ff7777;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .admin-info {
            color: #d4af37;
            font-size: 12px;
            line-height: 1.7;
            margin-top: 20px;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
        }

        .footer {
            color: #cccccc;
            font-size: 11px;
            margin-top: 22px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .logo {
                width: 95px;
                height: 95px;
            }
        }
        .google-login {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 15px;
}

.google-login img {
    width: 42px;
    height: 42px;
    padding: 7px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
}

.google-login img:hover {
    transform: scale(1.12);
    box-shadow: 0 0 12px #d4af37;
}
    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="https://64.media.tumblr.com/33ca84afd52d5cd0ef7bb1bb66c6176b/tumblr_o4ti6j8k6r1unefbyo1_400.png"
            alt="PLMUN Logo"
            class="logo"
        >

        <h1>I-PILIMUN Student ID INFORMATION</h1>

        <p class="subtitle">
            PAMANTASAN NG LUNGSOD NG MUNTINLUPA
        </p>

        <h2 class="login-title">LOGIN ACCOUNT</h2>

        <form id="loginForm">

            <div class="input-group">
                <label for="loginStudentID">Student ID Number</label>

                <input
                    type="text"
                    id="loginStudentID"
                    placeholder="Enter your Student ID"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="loginPIN">4-Digit PIN</label>

                <input
                    type="password"
                    id="loginPIN"
                    placeholder="Enter your 4-digit PIN"
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                LOGIN
            </button>

            <p id="loginMessage" class="message" role="alert"></p>

        </form>

        <!-- INSTITUTIONAL EMAIL LOGIN -->

       <div class="divider">
    OR LOGIN / SIGN UP VIA INSTITUTIONAL EMAIL
</div>

<div class="google-login">
    <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google Login"
        title="Continue with Google"
        onclick="googleLogin()"
    >
</div>

        <p class="register-link">
            Don't have an account?
            <a href="register-page.html">Sign Up Here</a>
        </p>

        <p id="googleMessage" class="message" role="alert"></p>

        <div class="admin-info">
            <strong>ADMIN DEMO ACCOUNT</strong><br>
            Student ID: PLMUN-ADMIN<br>
            PIN: 1234
        </div>

        <p class="footer">
            © 2026 Pamantasan ng Lungsod ng Muntinlupa<br>
            Student ID Information System
        </p>

    </div>

    <script>
        // =====================================
        // SUPABASE CONFIGURATION
        // =====================================

        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        // =====================================
        // EXISTING STUDENT ID + PIN LOGIN
        // =====================================

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            login();
        });

        function login() {
            const studentID = document
                .getElementById("loginStudentID")
                .value.trim().toUpperCase();

            const pin = document
                .getElementById("loginPIN")
                .value.trim();

            const message = document.getElementById("loginMessage");

            message.textContent = "";

            if (!studentID || !pin) {
                message.textContent =
                    "Please enter your Student ID and PIN.";
                return;
            }

            if (!/^\d{4}$/.test(pin)) {
                message.textContent =
                    "Your PIN must contain exactly 4 digits.";
                return;
            }

            // ADMIN LOGIN
            if (
                studentID === "PLMUN-ADMIN" &&
                pin === "1234"
            ) {
                sessionStorage.setItem(
                    "plmunAdminLoggedIn",
                    "true"
                );

                window.location.href = "admin-dashboard.html";
                return;
            }

            // EXISTING LOCAL STUDENT LOGIN
            let students = [];

            try {
                students = JSON.parse(
                    localStorage.getItem("students") || "[]"
                );

                if (!Array.isArray(students)) {
                    students = [];
                }

            } catch (error) {
                message.textContent =
                    "Unable to load student records.";
                return;
            }

            const student = students.find(function(item) {
                return (
                    item &&
                    typeof item.id === "string" &&
                    item.id.toUpperCase() === studentID &&
                    String(item.pin) === pin
                );
            });

            if (student) {
                localStorage.setItem(
                    "currentStudentSession",
                    JSON.stringify(student)
                );

                window.location.href = "student-dashboard.html";

            } else {
                message.textContent =
                    "Invalid Student ID Number or PIN!";
            }
        }


        // =====================================
        // GOOGLE LOGIN / SIGN UP WITH SUPABASE
        // =====================================

        const googleButton = document.getElementById("googleLoginButton");
        const googleMessage = document.getElementById("googleMessage");

        googleButton.addEventListener("click", async function() {

            googleMessage.textContent = "";

            if (
                SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
                SUPABASE_ANON_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
            ) {
                googleMessage.textContent =
                    "Please configure your Supabase URL and Publishable Key first.";
                return;
            }

            googleButton.disabled = true;
            googleButton.textContent = "Connecting to Google...";

            try {

                const redirectURL = new URL(
                    "student-dashboard.html",
                    window.location.href
                ).href;

                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: "google",

                    options: {
                        redirectTo: redirectURL,

                        // Google Workspace domain hint only.
                        // The domain must still be validated securely.
                        queryParams: {
                            hd: "plmun.edu.ph",
                            prompt: "select_account"
                        }
                    }
                });

                if (error) {
                    throw error;
                }

            } catch (error) {

                console.error("Google login error:", error);

                googleMessage.textContent =
                    error.message || "Unable to connect to Google.";

                googleButton.disabled = false;
                googleButton.innerHTML = `
                    <svg class="google-icon" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.73 7.18l7.64 5.91c4.46-4.12 7.13-10.2 7.13-17.56z"/>
                        <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.79l-7.64-5.91c-2.12 1.42-4.83 2.26-8.27 2.26-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Continue with Google
                `;

            }

        });

    </script>

</body>
</html>
