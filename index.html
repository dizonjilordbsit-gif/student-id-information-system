<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-PILIMON Student ID INFORMATION</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(rgba(0,25,12,.82), rgba(0,20,10,.90)),
                url("https://ts4.mm.bing.net/th?id=OIP.BIgd-vlLpw2hbK2ITm1-XQHaEK&pid=15.1");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 35px 30px;
            text-align: center;
            background: rgba(0,35,18,.94);
            border: 2px solid #d4af37;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0,255,100,.25);
        }

        .logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px #00ff66);
        }

        h1 {
            color: white;
            font-size: 23px;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .login-title {
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            outline: none;
            background: #f5f5f5;
            color: #003b20;
            font-size: 15px;
        }

        .input-group input:focus {
            border: 2px solid #00ff66;
            box-shadow: 0 0 8px rgba(0,255,102,.4);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #006b38;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #d4af37;
            color: #003b20;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .login-button:hover {
            background: #f1d46a;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(212,175,55,.5);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            min-height: 20px;
            color: #ff7777;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .success-message {
            color: #7dff9b;
        }

        .register-link {
            color: white;
            font-size: 13px;
            margin-top: 17px;
        }

        .register-link a {
            color: #d4af37;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .footer {
            color: #ccc;
            font-size: 11px;
            margin-top: 22px;
            line-height: 1.5;
        }

        @media screen and (max-width: 768px) {
            body {
                padding: 15px;
                background-attachment: scroll;
            }

            .login-container {
                max-width: 430px;
                padding: 30px 25px;
            }

            h1 {
                font-size: 21px;
            }

            .subtitle {
                font-size: 12px;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                min-height: 100vh;
                padding: 20px 12px;
                align-items: flex-start;
                background-attachment: scroll;
            }

            .login-container {
                max-width: 100%;
                padding: 25px 20px;
                margin: auto 0;
                border-radius: 15px;
            }

            .logo {
                width: 90px;
                height: 90px;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 19px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: .7px;
                margin-bottom: 22px;
            }

            .login-title {
                font-size: 19px;
            }

            .input-group input {
                padding: 13px;
                font-size: 16px;
            }

            .login-button {
                padding: 14px;
                font-size: 15px;
            }

            .register-link {
                font-size: 12px;
                line-height: 1.6;
            }

            .footer {
                font-size: 10px;
            }
        }

        @media screen and (max-width: 360px) {
            .login-container {
                padding: 22px 15px;
            }

            .logo {
                width: 78px;
                height: 78px;
            }

            h1 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <img
        src="https://64.media.tumblr.com/33ca84afd52d5cd0ef7bb1bb66c6176b/tumblr_o4ti6j8k6r1unefbyo1_400.png"
        alt="PLMUN Logo"
        class="logo"
    >

    <h1>I-PILIMON Student ID INFORMATION</h1>

    <p class="subtitle">
        PAMANTASAN NG LUNGSOD NG MUNTINLUPA
    </p>

    <h2 class="login-title">LOGIN</h2>

    <form id="loginForm">

        <div class="input-group">
            <label for="loginEmail">Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your registered email"
                autocomplete="username"
                required
            >
        </div>

        <div class="input-group">
            <label for="loginPassword">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                    onclick="togglePasswordVisibility()"
                >SHOW</button>
            </div>
        </div>

        <button type="submit" class="login-button" id="loginButton">
            LOGIN
        </button>

        <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>

    </form>

    <p class="register-link">
        Don't have an account?
        <a href="register-page.html">Sign Up Here</a>
    </p>

    <p class="footer">
        © 2026 Pamantasan ng Lungsod ng Muntinlupa<br>
        Student ID Information System
    </p>

</div>

<script>
    const SUPABASE_URL =
        "https://mlrpkkmexmboqrnmjkuy.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_-BIYMjip4Zon8HwZUCPT1Q_P0pDCMke";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    // ADMIN-ONLY EMAIL
    const ADMIN_ONLY_EMAILS = [
        "lorillarexc@gmail.com"
    ];

    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();
            await loginUser();
        });

    async function loginUser() {

        const email = document
            .getElementById("loginEmail")
            .value.trim()
            .toLowerCase();

        const password = document
            .getElementById("loginPassword")
            .value;

        const message = document.getElementById("loginMessage");
        const button = document.getElementById("loginButton");

        message.textContent = "";
        message.classList.remove("success-message");

        button.disabled = true;
        button.textContent = "PLEASE WAIT...";

        try {

            // STEP 1: Authenticate using Supabase
            const { data: authData, error: authError } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (authError) {
                throw new Error("Incorrect email or password.");
            }

            if (!authData.user) {
                throw new Error("Unable to verify your account.");
            }

            const userID = authData.user.id;
            const authenticatedEmail =
                (authData.user.email || "").toLowerCase();

            // STEP 2: Check admin_users table
            const { data: adminRecord, error: adminError } =
                await supabaseClient
                    .from("admin_users")
                    .select("user_id")
                    .eq("user_id", userID)
                    .maybeSingle();

            if (adminError) {
                throw new Error(
                    "Unable to verify account access. Please check your admin_users table and RLS policies."
                );
            }

            // STEP 3: Explicit admin-only email restriction
            if (ADMIN_ONLY_EMAILS.includes(authenticatedEmail)) {

                if (!adminRecord) {
                    await supabaseClient.auth.signOut();
                    throw new Error(
                        "Admin access is not configured for this account. Please contact the administrator."
                    );
                }

                message.textContent = "Admin login successful!";
                message.classList.add("success-message");

                window.location.replace("admin-dashboard.html");
                return;
            }

            // STEP 4: Other registered admin accounts
            if (adminRecord) {

                message.textContent = "Admin login successful!";
                message.classList.add("success-message");

                window.location.replace("admin-dashboard.html");
                return;
            }

            // STEP 5: Check student record for non-admin accounts
            const { data: studentRecord, error: studentError } =
                await supabaseClient
                    .from("students")
                    .select("id")
                    .eq("id", userID)
                    .maybeSingle();

            if (studentError) {
                throw new Error(
                    "Unable to verify student record. Please check your students table and RLS policies."
                );
            }

            // STEP 6: Allow only registered students
            if (studentRecord) {

                message.textContent = "Student login successful!";
                message.classList.add("success-message");

                window.location.replace("student-dashboard.html");
                return;
            }

            // STEP 7: Reject accounts without a role
            await supabaseClient.auth.signOut();

            throw new Error(
                "Access denied. Your account is not registered as a Student or Admin."
            );

        } catch (error) {

            console.error("Login Error:", error);

            message.textContent =
                error.message || "Unable to login. Please try again.";

        } finally {

            button.disabled = false;
            button.textContent = "LOGIN";
        }
    }

    // SHOW / HIDE PASSWORD
    function togglePasswordVisibility() {

        const input = document.getElementById("loginPassword");
        const button = document.getElementById("togglePassword");

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "HIDE";
        } else {
            input.type = "password";
            button.textContent = "SHOW";
        }
    }
</script>

</body>
</html>
```
