<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-PILIMUN Student ID INFORMATION</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(rgba(0, 25, 12, 0.82), rgba(0, 20, 10, 0.90)),
                url("https://ts4.mm.bing.net/th?id=OIP.BIgd-vlLpw2hbK2ITm1-XQHaEK&pid=15.1");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 35px 30px;
            text-align: center;
            background: rgba(0, 35, 18, 0.94);
            border: 2px solid #d4af37;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0, 255, 100, 0.25);
        }

        .logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px #00ff66);
        }

        h1 {
            color: #ffffff;
            font-size: 23px;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .login-title {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            outline: none;
            background: #f5f5f5;
            color: #003b20;
            font-size: 15px;
        }

        .input-group input:focus {
            border: 2px solid #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #d4af37;
            color: #003b20;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #f1d46a;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .message {
            min-height: 20px;
            color: #ff7777;
            font-size: 13px;
            margin-top: 15px;
        }

        .admin-info {
            color: #d4af37;
            font-size: 12px;
            line-height: 1.7;
            margin-top: 20px;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
        }

        .footer {
            color: #cccccc;
            font-size: 11px;
            margin-top: 22px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .logo {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="https://64.media.tumblr.com/33ca84afd52d5cd0ef7bb1bb66c6176b/tumblr_o4ti6j8k6r1unefbyo1_400.png"
            alt="PLMUN Logo"
            class="logo"
        >

        <h1>I-PILIMUN Student ID INFORMATION</h1>

        <p class="subtitle">
            PAMANTASAN NG LUNGSOD NG MUNTINLUPA
        </p>

        <h2 class="login-title">LOGIN ACCOUNT</h2>

        <form id="loginForm">

            <div class="input-group">
                <label for="loginStudentID">Student ID Number</label>

                <input
                    type="text"
                    id="loginStudentID"
                    placeholder="Enter your Student ID"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="loginPIN">4-Digit PIN</label>

                <input
                    type="password"
                    id="loginPIN"
                    placeholder="Enter your 4-digit PIN"
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                LOGIN
            </button>

            <p id="loginMessage" class="message" role="alert"></p>

        </form>

        <div class="admin-info">
            <strong>ADMIN DEMO ACCOUNT</strong><br>
            Student ID: PLMUN-ADMIN<br>
            PIN: 1234
        </div>

        <p class="footer">
            © 2026 Pamantasan ng Lungsod ng Muntinlupa<br>
            Student ID Information System
        </p>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            login();
        });

        function login() {
            const studentID = document
                .getElementById("loginStudentID")
                .value
                .trim()
                .toUpperCase();

            const pin = document
                .getElementById("loginPIN")
                .value
                .trim();

            const message = document.getElementById("loginMessage");

            message.textContent = "";

            // CHECK EMPTY INPUTS
            if (!studentID || !pin) {
                message.textContent =
                    "Please enter your Student ID and PIN.";
                return;
            }

            // CHECK 4-DIGIT PIN
            if (!/^\d{4}$/.test(pin)) {
                message.textContent =
                    "Your PIN must contain exactly 4 digits.";
                return;
            }

            // ADMIN LOGIN
            if (
                studentID === "PLMUN-ADMIN" &&
                pin === "1234"
            ) {
                sessionStorage.setItem(
                    "plmunAdminLoggedIn",
                    "true"
                );

                window.location.href = "admin-dashboard.html";
                return;
            }

            // GET REGISTERED STUDENTS
            let students = [];

            try {
                students = JSON.parse(
                    localStorage.getItem("students") || "[]"
                );

                if (!Array.isArray(students)) {
                    students = [];
                }

            } catch (error) {
                message.textContent =
                    "Unable to load student records.";
                return;
            }

            // FIND STUDENT ACCOUNT
            const student = students.find(function(item) {
                return (
                    item &&
                    typeof item.id === "string" &&
                    item.id.toUpperCase() === studentID &&
                    String(item.pin) === pin
                );
            });

            // STUDENT LOGIN SUCCESS
            if (student) {

                localStorage.setItem(
                    "currentStudentSession",
                    JSON.stringify(student)
                );

                window.location.href = "student-dashboard.html";

            } else {

                message.textContent =
                    "Invalid Student ID Number or PIN!";

            }
        }
    </script>

</body>
</html>
