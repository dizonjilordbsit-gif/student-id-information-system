
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I-PILIMUN Student ID INFORMATION</title>

    <!-- SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                linear-gradient(
                    rgba(0, 25, 12, 0.82),
                    rgba(0, 20, 10, 0.90)
                ),
                url("https://ts4.mm.bing.net/th?id=OIP.BIgd-vlLpw2hbK2ITm1-XQHaEK&pid=15.1");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* LOGIN CONTAINER */

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 35px 30px;
            text-align: center;

            background: rgba(0, 35, 18, 0.94);
            border: 2px solid #d4af37;
            border-radius: 18px;

            box-shadow: 0 0 25px rgba(0, 255, 100, 0.25);
        }

        /* PLMUN LOGO */

        .logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin-bottom: 15px;

            filter: drop-shadow(0 0 12px #00ff66);
        }

        /* TITLE */

        h1 {
            color: #ffffff;
            font-size: 23px;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .login-title {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
        }

        /* INPUT FIELDS */

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px;

            border: 1px solid #d4af37;
            border-radius: 8px;
            outline: none;

            background: #f5f5f5;
            color: #003b20;
            font-size: 15px;
        }

        .input-group input:focus {
            border: 2px solid #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;

            background: #d4af37;
            color: #003b20;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #f1d46a;
            transform: translateY(-2px);

            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        /* DIVIDER */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 23px 0 15px;

            color: #d4af37;
            font-size: 12px;
            font-weight: bold;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(212, 175, 55, 0.6);
        }

        /* GOOGLE LOGO ONLY */

        .google-login {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }

        .google-login img {
            width: 42px;
            height: 42px;
            padding: 7px;

            background: white;
            border-radius: 50%;

            cursor: pointer;
            transition: 0.3s;
        }

        .google-login img:hover {
            transform: scale(1.12);
            box-shadow: 0 0 12px #d4af37;
        }

        /* REGISTER LINK */

        .register-link {
            color: #ffffff;
            font-size: 13px;
            margin-top: 17px;
        }

        .register-link a {
            color: #d4af37;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* ERROR MESSAGE */

        .message {
            min-height: 20px;
            color: #ff7777;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.5;
        }

        /* ADMIN DEMO INFORMATION */

        .admin-info {
            color: #d4af37;
            font-size: 12px;
            line-height: 1.7;

            margin-top: 20px;
            padding: 12px;

            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
        }

        /* FOOTER */

        .footer {
            color: #cccccc;
            font-size: 11px;
            margin-top: 22px;
            line-height: 1.5;
        }

        /* MOBILE RESPONSIVE */

       @media screen and (max-width: 768px) {

    body {
        padding: 15px;
        background-attachment: scroll;
    }

    .login-container {
        width: 100%;
        max-width: 430px;
        padding: 30px 25px;
    }

    h1 {
        font-size: 21px;
    }

    .subtitle {
        font-size: 12px;
    }

}


/* =====================================
   MOBILE RESPONSIVE DESIGN
===================================== */

@media screen and (max-width: 480px) {

    body {
        min-height: 100vh;
        padding: 20px 12px;
        align-items: flex-start;
        background-attachment: scroll;
    }

    .login-container {
        width: 100%;
        max-width: 100%;
        padding: 25px 20px;
        margin: auto 0;
        border-radius: 15px;
    }

    .logo {
        width: 90px;
        height: 90px;
        margin-bottom: 12px;
    }

    h1 {
        font-size: 19px;
        line-height: 1.4;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 0.7px;
        margin-bottom: 22px;
    }

    .login-title {
        font-size: 19px;
        margin-bottom: 18px;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        font-size: 13px;
    }

    .input-group input {
        width: 100%;
        padding: 13px;
        font-size: 16px;
    }

    .login-button {
        padding: 14px;
        font-size: 15px;
    }

    .divider {
        font-size: 10px;
        gap: 8px;
        margin: 20px 0 12px;
    }

    .google-login img {
        width: 42px;
        height: 42px;
    }

    .register-link {
        font-size: 12px;
        line-height: 1.6;
    }

    .admin-info {
        font-size: 11px;
        padding: 11px;
    }

    .footer {
        font-size: 10px;
    }

}


/* =====================================
   SMALL MOBILE DEVICES
===================================== */

@media screen and (max-width: 360px) {

    .login-container {
        padding: 22px 15px;
    }

    .logo {
        width: 78px;
        height: 78px;
    }

    h1 {
        font-size: 17px;
    }

    .subtitle {
        font-size: 10px;
    }

    .divider {
        font-size: 9px;
    }

}
    </style>
</head>

<body>

    <div class="login-container">

        <!-- PLMUN LOGO -->

        <img
            src="https://64.media.tumblr.com/33ca84afd52d5cd0ef7bb1bb66c6176b/tumblr_o4ti6j8k6r1unefbyo1_400.png"
            alt="PLMUN Logo"
            class="logo"
        >

        <!-- SYSTEM TITLE -->

        <h1>I-PILIMUN Student ID INFORMATION</h1>

        <p class="subtitle">
            PAMANTASAN NG LUNGSOD NG MUNTINLUPA
        </p>

        <h2 class="login-title">LOGIN ACCOUNT</h2>


        <!-- STUDENT AND ADMIN LOGIN FORM -->

        <form id="loginForm">

            <div class="input-group">

                <label for="loginStudentID">
                    Student ID Number
                </label>

                <input
                    type="text"
                    id="loginStudentID"
                    placeholder="Enter your Student ID"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="loginPIN">
                    4-Digit PIN
                </label>

                <input
                    type="password"
                    id="loginPIN"
                    placeholder="Enter your 4-digit PIN"
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit" class="login-button">
                LOGIN
            </button>

            <p
                id="loginMessage"
                class="message"
                role="alert"
            ></p>

        </form>


        <!-- INSTITUTIONAL EMAIL LOGIN -->

        <div class="divider">
            OR LOGIN / SIGN UP VIA INSTITUTIONAL EMAIL
        </div>


        <!-- GOOGLE LOGO ONLY - NO LARGE BUTTON -->

        <div class="google-login">

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google Login"
                title="Continue with Google"
                onclick="googleLogin()"
            >

        </div>


        <p
            id="googleMessage"
            class="message"
            role="alert"
        ></p>


        <!-- REGISTRATION LINK -->

        <p class="register-link">

            Don't have an account?

            <a href="register-page.html">
                Sign Up Here
            </a>

        </p>


        <!-- ADMIN DEMO ACCOUNT -->

        <div class="admin-info">

            <strong>ADMIN DEMO ACCOUNT</strong><br>

            Student ID: PLMUN-ADMIN<br>

            PIN: 1234

        </div>


        <!-- FOOTER -->

        <p class="footer">

            © 2026 Pamantasan ng Lungsod ng Muntinlupa<br>

            Student ID Information System

        </p>

    </div>


    <script>

        // =====================================
        // SUPABASE CONFIGURATION
        // =====================================

        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";

        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";


        let supabaseClient = null;


        // Initialize Supabase only when credentials are configured

        if (
            SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL" &&
            SUPABASE_ANON_KEY !== "YOUR_SUPABASE_PUBLISHABLE_KEY"
        ) {

            supabaseClient = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        }


        // =====================================
        // STUDENT ID + PIN LOGIN
        // =====================================

        const loginForm = document.getElementById("loginForm");


        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            login();

        });


        function login() {

            const studentID = document
                .getElementById("loginStudentID")
                .value
                .trim()
                .toUpperCase();


            const pin = document
                .getElementById("loginPIN")
                .value
                .trim();


            const message = document.getElementById("loginMessage");

            message.textContent = "";


            // CHECK EMPTY INPUTS

            if (!studentID || !pin) {

                message.textContent =
                    "Please enter your Student ID and PIN.";

                return;

            }


            // CHECK PIN FORMAT

            if (!/^\d{4}$/.test(pin)) {

                message.textContent =
                    "Your PIN must contain exactly 4 digits.";

                return;

            }


            // =====================================
            // ADMIN LOGIN
            // =====================================

            if (
                studentID === "PLMUN-ADMIN" &&
                pin === "1234"
            ) {

                sessionStorage.setItem(
                    "plmunAdminLoggedIn",
                    "true"
                );

                window.location.href = "admin-dashboard.html";

                return;

            }


            // =====================================
            // STUDENT LOGIN
            // =====================================

            let students = [];


            try {

                students = JSON.parse(
                    localStorage.getItem("students") || "[]"
                );


                if (!Array.isArray(students)) {

                    students = [];

                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to load student records.";

                return;

            }


            // FIND STUDENT RECORD

            const student = students.find(function(item) {

                return (

                    item &&

                    typeof item.id === "string" &&

                    item.id.toUpperCase() === studentID &&

                    String(item.pin) === pin

                );

            });


            if (student) {

                localStorage.setItem(
                    "currentStudentSession",
                    JSON.stringify(student)
                );


                window.location.href = "student-dashboard.html";


            } else {

                message.textContent =
                    "Invalid Student ID Number or PIN!";

            }

        }


        // =====================================
        // GOOGLE LOGIN USING SUPABASE
        // =====================================

        async function googleLogin() {

            const googleMessage =
                document.getElementById("googleMessage");


            googleMessage.textContent = "";


            // CHECK SUPABASE CONFIGURATION

            if (!supabaseClient) {

                googleMessage.textContent =
                    "Please configure your Supabase URL and Publishable Key first.";

                return;

            }


            try {

                const redirectURL = new URL(
                    "student-dashboard.html",
                    window.location.href
                ).href;


                const { error } =
                    await supabaseClient.auth.signInWithOAuth({

                        provider: "google",

                        options: {

                            redirectTo: redirectURL,

                            queryParams: {

                                hd: "plmun.edu.ph",

                                prompt: "select_account"

                            }

                        }

                    });


                if (error) {

                    throw error;

                }

            } catch (error) {

                console.error(
                    "Google Login Error:",
                    error
                );


                googleMessage.textContent =
                    error.message ||
                    "Unable to connect to Google.";

            }

        }

    </script>

</body>
</html>
