<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="container"><section class="card" style="max-width:480px;margin:50px auto"><h1>Student ID Information System</h1><p class="muted">Sign in to access your student account.</p><div id="message" class="notice" hidden></div><form class="form" onsubmit="login(event)"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Log in</button></form><p>New student? <a href="register.html">Create an account</a></p><hr><p class="muted">Demo admin: admin@school.test<br>Demo password: Admin123!</p></section></main></body></html>
