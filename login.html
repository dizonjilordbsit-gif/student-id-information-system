<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>login</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js" defer></script><script src="app.js" defer></script></head><body class="auth-page" onload=""><main class="wrap"><section class="card auth-card"><h1>PLMUN Online ID Application</h1><p>Sign in to your account.</p><div id="message" class="notice hidden"></div><form class="form" onsubmit="login(event)"><label class="field">Email<input id="email" type="email" required></label><label class="field">Password<input id="password" type="password" required></label><button>Sign in</button></form><p class="small" style="text-align:center">For account access, please contact the PLMUN administrator.</p></section></main></body></html>
