<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | PLMUN</title><style>
:root{--g:#064b35;--g2:#0b6849;--gold:#d6ad45;--bg:#f7f5ed}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#18352a}header{background:var(--g);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:bold}.brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 6px #39e69b)}button{cursor:pointer;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;background:transparent;color:white}.layout{display:flex;min-height:calc(100vh - 72px)}aside{width:225px;background:#073d2d;padding:18px 12px;flex-shrink:0}aside a{display:block;color:white;text-decoration:none;padding:12px;border-radius:8px;margin-bottom:6px}aside a.active,aside a:hover{background:var(--g2);border-left:4px solid var(--gold)}main{width:100%;max-width:1050px;margin:auto;padding:30px}.eyebrow{font-size:12px;color:#8a6a18;font-weight:bold;letter-spacing:1px;text-transform:uppercase}h1{color:var(--g);margin:8px 0}.sub{color:#64756d;margin:0 0 22px}.card{background:white;border:1px solid #e4e5dc;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #18352a0b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{background:#f8f9f5;border-radius:9px;padding:13px;margin:8px 0}.field small{display:block;color:#728078;margin-bottom:6px}.notice{padding:13px;background:#fff7df;border-left:4px solid var(--gold);border-radius:7px;color:#68551f}.pill{display:inline-block;padding:7px 12px;border-radius:25px;background:#fff2cc;color:#755400;font-weight:bold;font-size:13px}footer{text-align:center;color:#7b887f;padding:20px;font-size:12px}@media(max-width:700px){.layout{display:block}aside{width:100%;display:flex;overflow:auto;padding:8px;gap:4px}aside a{white-space:nowrap;margin:0;padding:10px}main{padding:20px 14px}.grid{grid-template-columns:1fr}.brand{font-size:12px}.brand img{width:34px;height:34px}}
</style></head><body>
<header><div class="brand"><img src="https://64.media.tumblr.com/33ca84afd52d5cd0ef7bb1bb66c6176b/tumblr_o4ti6j8k6r1unefbyo1_400.png" alt="PLMUN"><span>I-PILIMUN Student ID INFORMATION</span></div><button onclick="logout()">Log Out</button></header>
<div class="layout"><aside><a class="" href="student-dashboard.html">Dashboard</a><a class="active" href="profile.html">My Profile</a><a class="" href="id.html">My Student ID</a><a class="" href="application.html">Application Status</a><a class="" href="document.html">My Documents</a></aside><main><div class="eyebrow">Student Portal</div><h1>My Profile</h1><p class="sub">View your registered student information.</p><div id="message" class="notice">Loading profile...</div><section class="card" id="card" hidden><div class="grid" id="fields"></div></section></main></div><footer>PLMUN Student ID Information System</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://mlrpkkmexmboqrnmjkuy.supabase.co","sb_publishable_-BIYMjip4Zon8HwZUCPT1Q_P0pDCMke");let currentUser=null;
async function getStudent(){const {data,error}=await db.auth.getSession();currentUser=data.session?.user;if(error||!currentUser){location.href="index.html";return null;}const r=await db.from("students").select("*").eq("id",currentUser.id).maybeSingle();if(r.error||!r.data){document.getElementById("message").textContent="Hindi ma-load ang student record. Check ang students table at RLS policies.";return null;}return r.data;}
async function logout(){await db.auth.signOut();location.href="index.html";}
(async()=>{const s=await getStudent();if(!s)return;const f=[["Student Number",s.student_number],["First Name",s.first_name],["Last Name",s.last_name],["Email",s.email],["Course",s.course],["Year Level",s.year_level],["Birthdate",s.birthdate]];document.getElementById("fields").innerHTML=f.map(([k,v])=>`<div class="field"><small>${k}</small><strong>${v||"Not provided"}</strong></div>`).join("");document.getElementById("card").hidden=false;document.getElementById("message").hidden=true;})();
</script></body></html>
