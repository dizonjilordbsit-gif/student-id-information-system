
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLMUN Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --green-dark: #041f17;
    --green-main: #075c3b;
    --green-light: #128052;
    --gold: #d9bd68;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #17233b;
    background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.65)),
        url("https://ts4.mm.bing.net/th?id=OIP.BIgd-vlLpw2hbK2ITm1-XQHaEK&pid=15.1");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.hidden {
    display: none !important;
}

.header {
    background: rgba(4,31,23,.96);
    color: white;
    padding: 25px;
    border-radius: 15px;
    border-bottom: 4px solid var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.header h1 {
    color: var(--gold);
    margin: 0 0 8px;
}

.card {
    background: rgba(255,255,255,.97);
    padding: 25px;
    border-radius: 15px;
    margin: 20px 0;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

.card h2 {
    color: var(--green-main);
    margin-top: 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.stat {
    background: #e7f3ec;
    padding: 20px;
    border-radius: 10px;
    border-left: 5px solid var(--gold);
}

.stat h1 {
    color: var(--green-main);
    font-size: 35px;
    margin-bottom: 0;
}

button {
    background: var(--green-main);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    margin: 4px;
    font-weight: bold;
}

button:hover {
    background: var(--green-light);
}

.logout-btn, .delete-btn {
    background: #a52a2a;
}

.logout-btn:hover, .delete-btn:hover {
    background: #cc3333;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #bbb;
    border-radius: 7px;
    font-size: 14px;
}

label {
    font-weight: bold;
    color: #263b31;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    min-width: 850px;
}

th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
    font-size: 13px;
}

th {
    background: var(--green-main);
    color: white;
}

.status {
    font-weight: bold;
    padding: 5px 9px;
    border-radius: 15px;
}

.pending {
    background: #fff0c2;
    color: #765500;
}

.approved {
    background: #d9f5e3;
    color: #087438;
}

.rejected {
    background: #ffe0e0;
    color: #a00000;
}

.message {
    font-weight: bold;
    color: var(--green-main);
}

@media(max-width:750px) {
    .stats, .form-grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ADMIN HEADER -->
    <header class="header">
        <div>
            <h1>PLMUN ADMIN DASHBOARD</h1>
            <p>Student ID Information Management System</p>
        </div>

        <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </header>

    <!-- STATISTICS -->
    <section class="card">
        <h2>Dashboard Overview</h2>

        <div class="stats">
            <div class="stat">
                <h3>Total Students</h3>
                <h1 id="totalStudents">0</h1>
            </div>

            <div class="stat">
                <h3>Total Courses</h3>
                <h1 id="totalCourses">0</h1>
            </div>

            <div class="stat">
                <h3>Pending Applications</h3>
                <h1 id="pendingStudents">0</h1>
            </div>
        </div>
    </section>

    <!-- ADD STUDENT -->
    <section class="card">
        <h2>Add Student Record</h2>
        <p>Enter the student's information below.</p>

        <form id="studentForm">

            <div class="form-grid">

                <div>
                    <label>Full Name</label>
                    <input type="text" id="studentName" required>
                </div>

                <div>
                    <label>Email Address</label>
                    <input type="email" id="studentEmail" required>
                </div>

                <div>
                    <label>Course</label>
                    <input type="text" id="studentCourse"
                    placeholder="Example: BSIT" required>
                </div>

                <div>
                    <label>Year Level</label>
                    <select id="studentYear" required>
                        <option value="">Select Year Level</option>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                        <option>5th Year</option>
                    </select>
                </div>

                <div>
                    <label>Birthday</label>
                    <input type="date" id="studentBirth">
                </div>

                <div>
                    <label>Contact Number</label>
                    <input type="text" id="studentPhone">
                </div>

                <div>
                    <label>Student PIN (4 digits)</label>
                    <input type="password" id="studentPIN"
                    maxlength="4" inputmode="numeric"
                    pattern="[0-9]{4}" required>
                </div>

                <div>
                    <label>Application Status</label>
                    <select id="studentStatus">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

            </div>

            <label>Admin Remarks</label>
            <textarea id="studentRemarks"
            placeholder="Enter remarks (optional)"></textarea>

            <button type="submit">ADD STUDENT</button>

            <p class="message" id="formMessage"></p>

        </form>
    </section>

    <!-- STUDENT RECORDS -->
    <section class="card">
        <h2>Registered Students</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by student ID, name, email or course..."
            oninput="renderStudents()"
        >

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>PIN</th>
                        <th>Status</th>
                        <th>Remarks</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </section>

</div>

<script>

// LOAD STUDENTS
let students = JSON.parse(localStorage.getItem("students") || "[]");

// ADMIN SESSION CHECK
if (sessionStorage.getItem("plmunAdminLoggedIn") !== "true") {
    alert("Please login as administrator first.");
    window.location.href = "index.html";
}

// SAVE DATABASE
function saveStudents() {
    localStorage.setItem("students", JSON.stringify(students));
}

// GENERATE STUDENT ID
function generateStudentID() {
    const year = new Date().getFullYear();
    let number;
    let id;

    do {
        number = Math.floor(1000 + Math.random() * 9000);
        id = `PLMUN-${year}-${number}`;
    } while (students.some(student => student.id === id));

    return id;
}

// ADD STUDENT
document.getElementById("studentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("studentName").value.trim();
    const email = document.getElementById("studentEmail").value.trim();
    const course = document.getElementById("studentCourse").value.trim();
    const year = document.getElementById("studentYear").value;
    const birth = document.getElementById("studentBirth").value;
    const phone = document.getElementById("studentPhone").value.trim();
    const pin = document.getElementById("studentPIN").value.trim();
    const status = document.getElementById("studentStatus").value;
    const remarks = document.getElementById("studentRemarks").value.trim();

    if (!/^[0-9]{4}$/.test(pin)) {
        document.getElementById("formMessage").innerText =
            "PIN must contain exactly 4 digits.";
        return;
    }

    const id = generateStudentID();

    const newStudent = {
        id,
        name,
        email,
        course,
        year,
        birth,
        phone,
        pin,
        status,
        remarks,
        photo: false,
        signature: false,
        documents: false
    };

    students.push(newStudent);

    saveStudents();
    this.reset();

    document.getElementById("formMessage").innerText =
        "Student added successfully! Student ID: " + id;

    renderStudents();
});

// UPDATE STATUS
function updateStatus(index, value) {
    students[index].status = value;
    saveStudents();
    renderStudents();
}

// UPDATE REMARKS
function updateRemarks(index, value) {
    students[index].remarks = value;
    saveStudents();
}

// DELETE STUDENT
function deleteStudent(index) {
    const confirmed = confirm(
        "Are you sure you want to delete this student record?"
    );

    if (!confirmed) return;

    students.splice(index, 1);
    saveStudents();
    renderStudents();
}

// STATUS CLASS
function getStatusClass(status) {
    return (status || "Pending").toLowerCase();
}

// DISPLAY RECORDS
function renderStudents() {
    const keyword = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    const table = document.getElementById("studentTable");
    table.innerHTML = "";

    const results = students
        .map((student, index) => ({student, index}))
        .filter(({student}) => {
            return [
                student.id,
                student.name,
                student.email,
                student.course,
                student.year
            ].some(value =>
                String(value || "").toLowerCase().includes(keyword)
            );
        });

    results.forEach(({student, index}) => {
        const row = table.insertRow();

        row.insertCell().innerText = student.id || "";
        row.insertCell().innerText = student.name || "";
        row.insertCell().innerText = student.email || "";
        row.insertCell().innerText = student.course || "";
        row.insertCell().innerText = student.year || "";
        row.insertCell().innerText = student.pin || "";

        const statusCell = row.insertCell();

        const select = document.createElement("select");

        ["Pending", "Approved", "Rejected"].forEach(status => {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = status;
            option.selected = (student.status || "Pending") === status;
            select.appendChild(option);
        });

        select.addEventListener("change", function() {
            updateStatus(index, this.value);
        });

        statusCell.appendChild(select);

        const remarksCell = row.insertCell();
        const remarksInput = document.createElement("input");

        remarksInput.value = student.remarks || "";
        remarksInput.placeholder = "Admin remarks";

        remarksInput.addEventListener("change", function() {
            updateRemarks(index, this.value);
        });

        remarksCell.appendChild(remarksInput);

        const actionCell = row.insertCell();

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "DELETE";
        deleteButton.className = "delete-btn";

        deleteButton.onclick = function() {
            deleteStudent(index);
        };

        actionCell.appendChild(deleteButton);
    });

    // UPDATE STATISTICS
    document.getElementById("totalStudents").innerText =
        students.length;

    const courses = new Set(
        students.map(student => student.course)
            .filter(Boolean)
    );

    document.getElementById("totalCourses").innerText =
        courses.size;

    document.getElementById("pendingStudents").innerText =
        students.filter(student =>
            (student.status || "Pending") === "Pending"
        ).length;
}

// LOGOUT
function logout() {
    sessionStorage.removeItem("plmunAdminLoggedIn");
    window.location.href = "index.html";
}

// INITIALIZE
renderStudents();

</script>

</body>
</html>
