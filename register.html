<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="container"><section class="card"><h1>Student Registration</h1><p class="muted">Complete the form to create a demo student account.</p><div id="message" class="notice" hidden></div><form class="form" onsubmit="register(event)"><div class="grid"><label>First name<input id="firstName" required></label><label>Last name<input id="lastName" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><label>Course / Program<input id="course" required placeholder="e.g. BS Information Technology"></label><label>Year level<select id="year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>5th Year</option></select></label><label>Birth date<input id="birthdate" type="date" required></label></div><button type="submit">Register</button></form><p><a href="login.html">Back to login</a></p></section></main></body></html>
